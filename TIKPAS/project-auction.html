<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TIKPAS | Chi tiết Đấu giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@900&family=Plus+Jakarta+Sans:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0a044c] text-white font-['Plus_Jakarta_Sans']">

    <header class="fixed top-0 w-full z-50 bg-[#A8E8F9]/90 backdrop-blur-md py-4 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="text-2xl font-black text-[#FF69B4] font-['Epilogue']">TIKPAS</div>
            <nav class="space-x-8 font-bold text-[#211F60]">
                <a href="#">Đấu giá</a>
                <a href="#">Sự kiện</a>
                <a href="#">Hỗ trợ</a>
            </nav>
        </div>
    </header>

    <main class="pt-28 pb-16 px-6 max-w-7xl mx-auto grid grid-cols-12 gap-8">
        <div class="col-span-12 lg:col-span-8 space-y-8">
            <div class="glass-card rounded-[2.5rem] overflow-hidden grid grid-cols-1 md:grid-cols-2">
                <div class="h-[400px] relative">
                    <img src="https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=800" class="w-full h-full object-cover">
                    <span class="absolute top-4 left-4 bg-[#FF69B4] px-4 py-1 rounded-full text-xs font-black animate-pulse">LIVE</span>
                </div>
                <div class="p-8 flex flex-col justify-between bg-black/20">
                    <div>
                        <h1 class="text-4xl font-black uppercase text-white mb-2 neon-text">The Eras Tour</h1>
                        <p class="text-cyan-400 font-bold">Taylor Swift | Hà Nội 2026</p>
                    </div>
                    <div class="pt-6 border-t border-white/10">
                        <p class="text-[10px] uppercase opacity-50">Giá cao nhất hiện tại</p>
                        <div class="text-4xl font-black text-yellow-400">15.500.000đ</div>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-[2rem] p-8">
                <h3 class="text-xl font-black mb-6 flex items-center gap-2 text-cyan-400 uppercase">
                    <span class="material-symbols-outlined">reviews</span> Trải nghiệm người dùng
                </h3>
                <div id="blog-container" class="space-y-4">
                    </div>
                <button id="btn-open-blog" class="mt-6 bg-[#FF69B4] text-black font-black px-8 py-3 rounded-xl hover:scale-105 transition-all">
                    + VIẾT REVIEW
                </button>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-4">
            <div class="glass-card rounded-[2.5rem] overflow-hidden sticky top-28 border-2 border-[#FF69B4]/30 shadow-2xl">
                <div class="bg-[#FF69B4] p-4 text-center text-black font-black uppercase">Sàn đấu giá</div>
                <div class="p-8 space-y-6">
                    <div class="text-center">
                       <div class="inline-flex items-center gap-2 text-yellow-400 bg-yellow-400/10 px-4 py-2 rounded-full mb-2">
    <span class="material-symbols-outlined text-sm">timer</span>
    <span class="font-bold text-lg" id="countdown">00:00:00</span>
</div>
                    </div>
                    <div class
