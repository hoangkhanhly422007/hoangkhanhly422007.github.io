<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 9: Product Showcase</title>
    <link rel="stylesheet" href="Bai9.css">
</head>
<body>

    <div class="container">
        <h1>Our Products &reg;</h1>
        <button onclick="togglePrice()">Toggle Price</button>

        <div class="product-grid">
            <div class="product-card">
                <h3>Smartphone</h3>
                <p class="price">Price: 500 &euro;</p>
                <p>Latest model with AI camera &rarr;</p>
            </div>
            <div class="product-card">
                <h3>Laptop</h3>
                <p class="price">Price: 1200 &euro;</p>
                <p>High performance for work &rarr;</p>
            </div>
            <div class="product-card">
                <h3>Headphones</h3>
                <p class="price">Price: 150 &euro;</p>
                <p>Noise cancelling technology &rarr;</p>
            </div>
            <div class="product-card">
                <h3>Smartwatch</h3>
                <p class="price">Price: 200 &euro;</p>
                <p>Track your fitness daily &rarr;</p>
            </div>
        </div>
    </div>

    <script src="Bai9.js"></script>
</body>
</html>
